apiVersion: v1
kind: ConfigMap
metadata:
  name: digital-smart-city-config
  namespace: digital-smart-city
  labels:
    app.kubernetes.io/name: digital-smart-city
data:
  NODE_ENV: "production"
  PORT: "5000"
  # Override via GitHub secrets / kubectl — placeholders for CD
  CLIENT_URL: "https://APP_DOMAIN_PLACEHOLDER"
  CORS_ORIGINS: "https://APP_DOMAIN_PLACEHOLDER"
