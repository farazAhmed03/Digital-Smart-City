# DO NOT commit real secrets. Copy to secret.yaml locally or let CI create the secret.
# GitHub Actions CD job creates "digital-smart-city-secrets" from repository secrets.
apiVersion: v1
kind: Secret
metadata:
  name: digital-smart-city-secrets
  namespace: digital-smart-city
type: Opaque
stringData:
  DB_URL: "mongodb+srv://USER:PASS@cluster/db?retryWrites=true&w=majority"
  JWT_KEY: "replace-with-strong-secret"
  CLOUDINARY_CLOUD_NAME: "your-cloud"
  CLOUDINARY_API_KEY: "your-key"
  CLOUDINARY_API_SECRET: "your-secret"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "user@example.com"
  SMTP_PASS: "app-password"
  SMTP_FROM: "Digital Smart City <noreply@example.com>"
