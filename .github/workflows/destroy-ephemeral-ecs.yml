name: destroy-ephemeral-ecs-fargate-alb

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region where ephemeral environment was deployed
        required: false
        default: us-east-1

permissions:
  contents: read

env:
  PROJECT: ${{ vars.PROJECT || 'digital-smart-city' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'ephemeral' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}

jobs:
  destroy:
    name: terraform-destroy-temporary-environment
    runs-on: ubuntu-latest
    environment: ephemeral
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using repository secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Destroy temporary resources
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/destroy-ephemeral-ecs.sh
