name: deploy-ephemeral-ecs-fargate-alb

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for temporary environment
        required: false
        default: us-east-1
      destroy_after_test:
        description: Destroy resources after smoke test? true/false
        required: false
        default: "false"

permissions:
  contents: read

env:
  PROJECT: ${{ vars.PROJECT || 'digital-smart-city' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'ephemeral' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}

jobs:
  ci:
    name: ci-build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Backend install and CI smoke test
        working-directory: Backend
        run: |
          npm ci
          npm test

      - name: Frontend install and production build
        working-directory: Frontend
        env:
          CI: false
        run: |
          npm ci
          npm test -- --watchAll=false --passWithNoTests
          npm run build

  deploy:
    name: terraform-ecr-ecs-fargate-alb-deploy
    runs-on: ubuntu-latest
    needs: ci
    environment: ephemeral
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using repository secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create runtime env file from GitHub Secret
        run: |
          mkdir -p deployment/env
          cat > deployment/env/.env.testing <<'ENVEOF'
          ${{ secrets.TESTING_ENV_FILE }}
          ENVEOF
          sed -i 's/^          //' deployment/env/.env.testing
          chmod 600 deployment/env/.env.testing

      - name: Deploy temporary ECS Fargate + ALB environment
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          ENV_FILE: deployment/env/.env.testing
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/deploy-ephemeral-ecs.sh

      - name: Print ALB test URL
        working-directory: infra/terraform/envs/ephemeral
        run: |
          echo "ALB_URL=$(terraform output -raw alb_url)" >> "$GITHUB_STEP_SUMMARY"
          terraform output alb_url

      - name: Optional destroy after smoke test
        if: ${{ github.event.inputs.destroy_after_test == 'true' }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/destroy-ephemeral-ecs.sh
