name: deploy-ephemeral-ecs

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region for temporary environment
        required: true
        default: us-east-1
      destroy_after_test:
        description: Destroy resources after smoke test? true/false
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  PROJECT: digital-smart-city
  ENVIRONMENT: ephemeral
  AWS_REGION: ${{ inputs.aws_region }}

jobs:
  ci:
    name: ci-build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Backend dependency install and smoke test
        working-directory: Backend
        run: |
          npm ci
          npm test

      - name: Frontend dependency install and production build
        working-directory: Frontend
        run: |
          npm ci
          npm test -- --watchAll=false --passWithNoTests
          npm run build

  deploy:
    name: deploy-ecs-fargate-alb
    runs-on: ubuntu-latest
    needs: ci
    environment: ephemeral
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create runtime env file from GitHub secret
        run: |
          mkdir -p deployment/env
          cat > deployment/env/.env.testing <<'ENVEOF'
          ${{ secrets.TESTING_ENV_FILE }}
          ENVEOF
          sed -i 's/^          //' deployment/env/.env.testing

      - name: Deploy ephemeral ECS Fargate + ALB
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          ENV_FILE: deployment/env/.env.testing
        run: deployment/scripts/deploy-ephemeral-ecs.sh

      - name: Print ALB URL
        working-directory: infra/terraform/envs/ephemeral
        run: terraform output alb_url

      - name: Optional destroy after smoke test
        if: ${{ inputs.destroy_after_test == 'true' }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: deployment/scripts/destroy-ephemeral-ecs.sh
