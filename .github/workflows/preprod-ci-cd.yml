name: Digital Kohat Pre-Prod CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd Backend
          npm test || echo "Backend tests not configured yet"

      - name: Backend Security Audit
        run: |
          cd Backend
          npm audit --audit-level=high || true

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build Frontend
        run: |
          cd Frontend
          CI=false npm run build

      - name: Frontend Security Audit
        run: |
          cd Frontend
          npm audit --audit-level=high || true

  deploy-preprod:
    name: Deploy to EC2 Pre-Prod
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            echo "Updating server packages..."
            sudo yum update -y || true

            echo "Installing required packages..."
            sudo yum install -y git nginx || true

            if ! command -v node >/dev/null 2>&1; then
              echo "Installing Node.js 20..."
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
              sudo yum install -y nodejs
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2..."
              sudo npm install -g pm2
            fi

            echo "Starting nginx..."
            sudo systemctl enable nginx
            sudo systemctl start nginx

            echo "Preparing app directory..."
            sudo mkdir -p /var/www
            sudo chown -R $USER:$USER /var/www

            if [ ! -d /var/www/digital-kohat/.git ]; then
              echo "Cloning repository..."
              rm -rf /var/www/digital-kohat
              git clone https://github.com/${{ github.repository }}.git /var/www/digital-kohat
            fi

            cd /var/www/digital-kohat

            echo "Pulling latest code..."
            git fetch origin

            if git show-ref --verify --quiet refs/remotes/origin/main; then
              git reset --hard origin/main
            else
              git reset --hard origin/master
            fi

            echo "Installing backend..."
            cd Backend
            npm ci --omit=dev

            echo "Restarting backend with PM2..."
            pm2 restart digital-kohat-backend || pm2 start index.js --name digital-kohat-backend
            pm2 save

            echo "Building frontend..."
            cd ../Frontend
            npm ci
            CI=false npm run build

            echo "Deploying frontend to nginx..."
            sudo mkdir -p /var/www/html
            sudo rm -rf /var/www/html/*
            sudo cp -r build/* /var/www/html/

            echo "Reloading nginx..."
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "Deployment completed successfully."