name: deploy-prod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  BACKEND_ECR_REPOSITORY: prod-digital-smart-city-backend
  FRONTEND_BUCKET: prod-digital-smart-city-frontend-origin
  CLOUDFRONT_DISTRIBUTION_ID: CHANGE_ME
  ECS_CLUSTER: prod-digital-smart-city-cluster
  ECS_SERVICE: prod-digital-smart-city-api
  CODEDEPLOY_APPLICATION: prod-digital-smart-city-api
  CODEDEPLOY_DEPLOYMENT_GROUP: prod-digital-smart-city-api-bg
  REACT_APP_API_URL: https://api.example.com

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
      - name: Backend dependency install
        working-directory: Backend
        run: npm ci
      - name: Backend smoke tests
        working-directory: Backend
        run: npm test
      - name: Frontend dependency install
        working-directory: Frontend
        run: npm ci
      - name: Frontend tests
        working-directory: Frontend
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Frontend build validation
        working-directory: Frontend
        env:
          REACT_APP_API_URL: ${{ env.REACT_APP_API_URL }}
          CI: false
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      image_uri: ${{ steps.out.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build image
        run: |
          IMAGE_URI="${{ steps.login.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -f Backend/Dockerfile -t "$IMAGE_URI" Backend
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image
        run: docker push "$IMAGE_URI"
      - id: out
        run: echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deployment/taskdef.backend.json
          container-name: api
          image: ${{ needs.build-backend.outputs.image_uri }}
      - name: Deploy ECS blue/green
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: deployment/appspec.yml
          codedeploy-application: ${{ env.CODEDEPLOY_APPLICATION }}
          codedeploy-deployment-group: ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Build frontend
        working-directory: Frontend
        env:
          REACT_APP_API_URL: ${{ env.REACT_APP_API_URL }}
          CI: false
        run: |
          npm ci
          npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload static assets
        run: |
          aws s3 sync Frontend/build/ s3://${{ env.FRONTEND_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp Frontend/build/index.html s3://${{ env.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"
      - name: Invalidate CloudFront shell
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html"
