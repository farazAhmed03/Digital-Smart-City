name: ci-cd-ecr-ec2-k3s-kubernetes

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: digital-smart-city-ecr-k3s-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT: ${{ vars.PROJECT || 'digital-smart-city' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'ephemeral' }}
  K8S_NAMESPACE: digital-smart-city

jobs:
  build-push-deploy-k3s:
    name: Build images, push ECR, deploy to k3s on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required GitHub secrets
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.EC2_HOST }}" || (echo "Missing EC2_HOST" && exit 1)
          test -n "${{ secrets.EC2_USER }}" || (echo "Missing EC2_USER" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "Missing EC2_SSH_KEY" && exit 1)
          test -n "${{ secrets.TESTING_ENV_FILE }}" || (echo "Missing TESTING_ENV_FILE" && exit 1)

      - name: Setup Node.js for CI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend dependency check
        working-directory: Backend
        run: npm ci

      - name: Frontend dependency check
        working-directory: Frontend
        run: npm ci

      - name: Frontend tests
        working-directory: Frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Frontend build check
        working-directory: Frontend
        env:
          CI: false
        run: npm run build

      - name: Configure AWS credentials for ECR push
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image names
        id: vars
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BACKEND_REPO="${ENVIRONMENT}-${PROJECT}-backend"
          FRONTEND_REPO="${ENVIRONMENT}-${PROJECT}-frontend"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          BACKEND_IMAGE="${REGISTRY}/${BACKEND_REPO}:${GITHUB_SHA}"
          FRONTEND_IMAGE="${REGISTRY}/${FRONTEND_REPO}:${GITHUB_SHA}"

          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "backend_repo=${BACKEND_REPO}" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=${FRONTEND_REPO}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names "${{ steps.vars.outputs.backend_repo }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${{ steps.vars.outputs.backend_repo }}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE

          aws ecr describe-repositories --repository-names "${{ steps.vars.outputs.frontend_repo }}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${{ steps.vars.outputs.frontend_repo }}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login --username AWS --password-stdin "${{ steps.vars.outputs.registry }}"

      - name: Build and push backend image
        run: |
          docker build -t "${{ steps.vars.outputs.backend_image }}" ./Backend
          docker push "${{ steps.vars.outputs.backend_image }}"

      - name: Build and push frontend image
        run: |
          docker build -t "${{ steps.vars.outputs.frontend_image }}" ./Frontend
          docker push "${{ steps.vars.outputs.frontend_image }}"

      - name: Create deployment payload
        run: |
          mkdir -p deployment/env deployment/runtime

          cat > deployment/env/.env.k8s <<'ENVEOF'
          ${{ secrets.TESTING_ENV_FILE }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' deployment/env/.env.k8s

          cat > deployment/runtime/k8s-images.env <<EOF
          AWS_REGION=${AWS_REGION}
          AWS_ACCOUNT_ID=${{ steps.vars.outputs.account_id }}
          ECR_REGISTRY=${{ steps.vars.outputs.registry }}
          BACKEND_IMAGE=${{ steps.vars.outputs.backend_image }}
          FRONTEND_IMAGE=${{ steps.vars.outputs.frontend_image }}
          K8S_NAMESPACE=${K8S_NAMESPACE}
          EOF

          test -s deployment/env/.env.k8s
          test -s deployment/runtime/k8s-images.env

      - name: Upload Kubernetes deployment bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s,deployment/scripts/k3s-bootstrap.sh,deployment/scripts/deploy-k3s.sh,deployment/scripts/k3s-status.sh,deployment/env/.env.k8s,deployment/runtime/k8s-images.env"
          target: "/opt/digital-smart-city-k8s"

      - name: Deploy to k3s on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail

            cd /opt/digital-smart-city-k8s
            chmod +x deployment/scripts/*.sh

            echo "[INFO] Writing AWS credentials for ECR pull secret generation..."
            mkdir -p ~/.aws
            cat > ~/.aws/credentials <<EOF
            [default]
            aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            EOF
            cat > ~/.aws/config <<EOF
            [default]
            region=${AWS_REGION}
            output=json
            EOF
            chmod 600 ~/.aws/credentials ~/.aws/config

            ./deployment/scripts/k3s-bootstrap.sh
            ./deployment/scripts/deploy-k3s.sh
            ./deployment/scripts/k3s-status.sh

      - name: Print deployment URLs
        run: |
          echo "Application URL: http://${{ secrets.EC2_HOST }}"
          echo "Health URL: http://${{ secrets.EC2_HOST }}/healthz"
          echo "Kubernetes namespace: digital-smart-city"
