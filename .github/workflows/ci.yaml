name: Digital Kohat Pre-Prod CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Backend Test Check
        run: |
          cd Backend
          npm test || echo "Backend tests not configured yet"

      - name: Backend Audit
        run: |
          cd Backend
          npm audit --audit-level=high || true

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build Frontend
        run: |
          cd Frontend
          CI=false npm run build

      - name: Frontend Audit
        run: |
          cd Frontend
          npm audit --audit-level=high || true

  deploy-preprod:
    name: Deploy to Pre-Prod
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Pre-Prod Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          script: |
            cd /var/www/digital-kohat
            git pull origin main

            cd Backend
            npm ci --omit=dev
            pm2 restart digital-kohat-backend || pm2 start index.js --name digital-kohat-backend

            cd ../Frontend
            npm ci
            CI=false npm run build

            sudo systemctl reload nginx