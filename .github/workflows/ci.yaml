name: Digital Kohat CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Run CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ======================
      # Backend
      # ======================

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Tests (safe)
        run: |
          cd Backend
          npm test || echo "No backend tests yet"

      - name: Backend Security Audit
        run: |
          cd Backend
          npm audit --audit-level=high || true

      # ======================
      # Frontend
      # ======================

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build Frontend
        run: |
          cd Frontend
          CI=false npm run build

      - name: Frontend Security Audit
        run: |
          cd Frontend
          npm audit --audit-level=high || true

      # ======================
      # Final Check
      # ======================

      - name: CI Completed
        run: echo "CI checks passed successfully 🚀"