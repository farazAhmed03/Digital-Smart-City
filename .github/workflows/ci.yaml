name: Digital Kohat CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Tests (if any)
        run: |
          cd Backend
          npm test --if-present

      - name: Backend Security Audit
        run: |
          cd Backend
          npm audit --audit-level=high || true


  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build Frontend
        run: |
          cd Frontend
          npm run build

      - name: Frontend Security Audit
        run: |
          cd Frontend
          npm audit --audit-level=high || true